<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ilik Analytics | Inteligencia de Compra Hospitalaria</title>
    
    <!-- CONEXIÓN AL MOTOR DE ESTILOS ESTABLE -->
    <script src="https://tailwindcss.com"></script>
    
    <!-- FUENTES OFICIALES DE LA IDENTIDAD DE MARCA ILIK -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- BLINDAJE DE CSS NATIVO PARA RENDERIZADO OBLIGATORIO -->
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #E7E9ED; 
            color: #0B1420; 
            line-height: 1.6;
        }
        .font-serif { font-family: 'Fraunces', serif !important; }
        .max-w-7xl { max-w: 1200px; margin: 0 auto; padding: 0 24px; }
        
        /* Encabezado Corporativo */
        header { 
            background-color: #0B1420; 
            position: sticky; 
            top: 0; 
            z-index: 50; 
            border-bottom: 2px solid #3F8072;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }
        .header-container { 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            padding: 18px 0;
        }
        
        /* Menú de Accesos de Anclaje Líquido */
        nav { display: flex; gap: 24px; }
        nav a { color: rgba(255,255,255,0.8); text-decoration: none; font-size: 14px; font-weight: 500; transition: color 0.2s; }
        nav a:hover { color: #3F8072; }
        
        .btn-header {
            background-color: #3F8072;
            color: white;
            text-decoration: none;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 10px 16px;
            border-radius: 4px;
            transition: opacity 0.2s;
        }
        .btn-header:hover { opacity: 0.9; }

        /* Estructuras de Sección Mundiales */
        .section-white { background-color: #E7E9ED; padding: 100px 0; border-bottom: 1px solid rgba(11, 20, 32, 0.1); }
        .section-dark { background-color: #0B1420; color: #FFFFFF; padding: 100px 0; }
        .section-header-meta { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(11, 20, 32, 0.1); padding-bottom: 12px; margin-bottom: 48px; }
        .section-header-meta-dark { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-bottom: 12px; margin-bottom: 48px; }
        .meta-tag { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; opacity: 0.6; }
        
        /* Sección 1: Hero Principal */
        .hero-layout { display: flex; gap: 64px; align-items: center; padding: 60px 0 100px 0; }
        .hero-left { flex: 7; }
        .hero-right { flex: 5; }
        .hero-tag { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: #3F8072; margin-bottom: 16px; display: block; }
        .hero-layout h1 { font-size: 54px; font-weight: 700; line-height: 1.1; margin-bottom: 24px; color: #0B1420; }
        .hero-layout h1 span { color: #C98A3B; font-style: italic; font-weight: 400; }
        .hero-desc { font-size: 18px; opacity: 0.85; margin-bottom: 36px; }
        
        .cta-group { display: flex; gap: 16px; align-items: center; }
        .btn-primary { background-color: #C98A3B; color: white; text-decoration: none; padding: 16px 28px; border-radius: 6px; font-weight: 600; font-size: 15px; transition: opacity 0.2s; }
        .btn-secondary { color: #0B1420; text-decoration: none; font-weight: 600; font-size: 15px; border-bottom: 2px solid #0B1420; padding-bottom: 2px; }
        .btn-primary:hover, .btn-secondary:hover { opacity: 0.85; }

        .image-frame { background-color: white; padding: 8px; border-radius: 12px; border: 1px solid rgba(11, 20, 32, 0.1); box-shadow: 0 30px 60px rgba(0,0,0,0.1); aspect-ratio: 4/3; overflow: hidden; width: 100%; }
        .image-frame img { width: 100%; height: 100%; object-fit: cover; border-radius: 8px; }

        /* Sección 2: Nosotros (Origen Maya) */
        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 40px; margin-top: 60px; }
        .pillar-num { font-size: 24px; font-weight: 700; color: #3F8072; margin-right: 8px; }
        .pillar-text { font-size: 16px; font-weight: 500; }

        /* Sección 3: Qué Resolvemos (Kardex Seis Preguntas) */
        .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 48px; }
        .grid-questions { display: grid; grid-template-columns: 1fr 1fr; gap: 40px 48px; margin-top: 48px; }
        .question-card { display: flex; gap: 24px; }
        .question-num { font-size: 14px; font-weight: 600; opacity: 0.4; padding-top: 4px; }
        .question-content h4 { font-size: 18px; font-weight: 700; color: white; margin-bottom: 8px; }
        .question-content p { font-size: 14px; opacity: 0.7; }

        /* Sección 4: Metodología (7 Etapas) */
        .timeline-bar { display: flex; justify-content: space-between; border-bottom: 4px solid rgba(11, 20, 32, 0.1); padding-bottom: 12px; margin-top: 40px; }
        .timeline-step { font-size: 14px; font-weight: 600; opacity: 0.5; border-bottom: 4px solid transparent; margin-bottom: -16px; padding-bottom: 12px; }
        .timeline-step.active { opacity: 1; border-bottom-color: #3F8072; color: #3F8072; }
        .timeline-step.amber { opacity: 1; border-bottom-color: #C98A3B; color: #C98A3B; }
        .kardex-banner { background-color: #0B1420; color: white; padding: 48px; border-radius: 12px; margin-top: 48px; display: flex; align-items: center; gap: 64px; }
        .kardex-banner .num { font-size: 64px; font-weight: 700; font-family: 'Fraunces', serif; }
        .kardex-banner .text { font-size: 16px; opacity: 0.8; }

        /* Sección 5: Caso Real */
        .case-box { background-color: #0B1420; color: white; padding: 48px; border-radius: 16px; margin-top: 32px; }
        .case-split { display: grid; grid-template-columns: 4fr 8fr; gap: 48px; }
        .progress-container { margin-top: 24px; }
        .progress-label { display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; margin-bottom: 8px; opacity: 0.6; }
        .progress-bar-bg { width: 100%; height: 12px; background-color: rgba(255,255,255,0.1); border-radius: 999px; overflow: hidden; position: relative; }
        .progress-bar-fill { width: 47.3%; height: 100%; background-color: #3F8072; }
        .case-footer-metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 32px; margin-top: 32px; }
        .meta-label { font-size: 11px; text-transform: uppercase; tracking: 0.05em; opacity: 0.5; margin-bottom: 4px; display: block; }

        /* Sección 6: Cómo Trabajamos (3 Fases) */
        .grid-fases { display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; margin-top: 32px; }
        .fase-card { background-color: #0B1420; color: white; padding: 40px 32px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); }
        .fase-card.active { border-top: 3px solid #C98A3B; }
        .fase-title { font-size: 13px; font-weight: 600; text-transform: uppercase; tracking: 0.05em; opacity: 0.5; margin-bottom: 16px; display: block; }
        .fase-card h4 { font-size: 22px; font-weight: 700; margin-bottom: 12px; }
        .fase-duration { font-size: 12px; font-weight: 600; text-transform: uppercase; color: #3F8072; margin-top: 24px; display: block; }

        /* Sección 7: FAQ (Preguntas Frecuentes) */
        .faq-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 32px 48px; margin-top: 48px; }
        .faq-item h4 { font-size: 18px; font-weight: 700; color: white; margin-bottom: 12px; }
        .faq-item p { font-size: 14px; opacity: 0.75; }

        /* Conversión / Cierre (Doble Bloque Zoho & WhatsApp) */
        .conversion-section { background-color: #0B1420; color: white; padding: 120px 0; text-align: center; border-top: 1px solid rgba(255,255,255,0.1); }
        .conversion-title { font-size: 42px; font-weight: 700; margin-bottom: 16px; }
        .conversion-desc { opacity: 0.7; font-size: 16px; max-w: 600px; margin: 0 auto 48px auto; }
        .box-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; max-w: 800px; margin: 0 auto; text-align: left; }
        .box-card { background-color: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); padding: 40px; border-radius: 16px; display: flex; flex-direction: column; justify-content: space-between; }
        .box-card h4 { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
        .box-card p { font-size: 13px; opacity: 0.6; margin-bottom: 24px; }
        .btn-action-dark { display: block; width: 100%; text-align: center; background-color: white; color: #0B1420; font-weight: 700; font-size: 13px; text-transform: uppercase; letter-spacing: 0.05em; padding: 14px; border-radius: 6px; text-decoration: none; transition: opacity 0.2s; }
        .btn-action-teal { display: block; width: 100%; text-align: center; background-color: #3F8072; color: white; font-weight: 700; font-size: 13px; text-transform: uppercase; letter-spacing: 0.05em; padding: 14px; border-radius: 6px; text-decoration: none; transition: opacity 0.2s; }
        .btn-action-dark:hover, .btn-action-teal:hover { opacity: 0.9; }
